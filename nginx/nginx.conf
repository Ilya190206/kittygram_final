server {
    listen 80;
    index index.html;

    location = /kittygram {
        return 301 /kittygram/;
    }

    location /kittygram/api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /kittygram/admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /kittygram/static/ {
        alias /static/;
    }

    location /kittygram/media/ {
        alias /media/;
    }

    location /kittygram/ {
        rewrite ^/kittygram/(.*)$ /$1 break;
        root /static;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /static;
        try_files $uri $uri/ /index.html;
    }
}