volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME}/kittygram_backend
    env_file: .env
    volumes:
      - static:/app/collected_static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn kittygram_backend.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    image: ${DOCKERHUB_USERNAME}/kittygram_frontend
    command: sh -c "cp -r /app/build/static/. /static/ && cp /app/build/*.html /static/ && cp /app/build/*.json /static/ && cp /app/build/*.ico /static/ && cp /app/build/*.txt /static/"
    volumes:
      - static:/static

  gateway:
    image: ${DOCKERHUB_USERNAME}/kittygram_gateway
    ports:
      - "9000:80"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
